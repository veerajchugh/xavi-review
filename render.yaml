# Render Blueprint for the xavi-review site (adopts the existing service; secrets are set on the
# service directly and are preserved because they're omitted here).
services:
  - type: web
    name: xavi-review
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: DATABASE_URL     # internal connection string of the existing xavi-review-db Postgres
        fromDatabase:
          name: xavi-review-db
          property: connectionString
