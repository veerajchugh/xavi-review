<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Xavi Review</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Helvetica%22 font-weight=%22600%22 font-size=%2217%22 fill=%22white%22 text-anchor=%22middle%22%3EX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#eef3fb,#fbfbfd 60%);color:#1d1d1f;-webkit-font-smoothing:antialiased}
.box{width:min(380px,90vw);text-align:center}.mark{width:56px;height:56px;border-radius:16px;margin:0 auto 22px;background:linear-gradient(160deg,#2b2b2e,#000);display:grid;place-items:center;color:#fff;font-weight:600;font-size:22px;letter-spacing:-.02em;box-shadow:0 10px 30px rgba(0,0,0,.18)}
h1{font-size:32px;letter-spacing:-.03em;margin:0 0 6px;font-weight:700}p{color:#6e6e73;margin:0 0 28px;font-size:15px}
input{width:100%;height:50px;border-radius:14px;border:1px solid rgba(0,0,0,.1);padding:0 16px;font:inherit;font-size:17px;background:#fff;outline:none;transition:.2s}
input:focus{border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,.15)}button{margin-top:12px;width:100%;height:50px;border:0;border-radius:14px;background:#0071e3;color:#fff;font:inherit;font-weight:600;font-size:17px;cursor:pointer}
button:hover{background:#0077ed}.err{color:#d70015;font-size:14px;height:20px;margin-top:12px}
</style></head><body><form class="box" method="post" action="/login"><div class="mark">X</div><h1>Xavi Review</h1><p>Founding engineers, once a week.</p>
<input type="text" name="username" value="veeraj" autocomplete="username" hidden><input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password"><button>Continue</button><div class="err">{{ERR}}</div></form></body></html>
